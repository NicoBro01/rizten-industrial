<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B2545" />

    <!-- Titolo e meta description di default: ogni pagina li sovrascrive via il componente Seo -->
    <title>Rizten Industrial — Impianti e Manutenzione</title>
    <meta
      name="description"
      content="Rizten Industrial: manutenzione impianti, installazioni, saldature e interventi su chiamata per aziende ed enti. Affidabilità e competenza tecnica."
    />

    <!--
      Font ospitati localmente (self-hosted, via pacchetti npm @fontsource) anziché
      caricati da Google Fonts: nessuna richiesta né trasferimento di IP a server terzi
      al caricamento della pagina. Import CSS in src/main.jsx.
    -->

    <script type="text/javascript">
      // Ripristina l'URL originale codificato da 404.html (vedi public/404.html).
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
